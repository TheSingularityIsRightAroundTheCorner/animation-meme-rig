<!doctype html><html lang="en"><meta charset="utf-8"><title>Robot Motion — Hero Camera</title>
<style>body{margin:0;background:#202634;color:#e8eef8;font:15px system-ui}header{padding:14px;display:flex;gap:14px;align-items:center}button,select{padding:9px;background:#34465d;color:white;border:1px solid #66809c;border-radius:5px}input{flex:1}canvas{display:block;width:100%;height:auto}.note{padding:8px 16px;color:#aebed1}a{color:#8bccff}</style>
<header><b>HERO CAMERA</b><select id="shot"><option value="cross">Charge → downward release → hero hold</option><option value="run">Knee-height Dutch-angle run</option></select><button id="play">Play / pause</button><input id="time" type="range" min="0" max="4.5" step="0.0416667" value="0"><output id="stamp">0.00 s</output><a href="index.html">Fusion lab</a></header>
<div id="stage"></div><div class="note">Transparent 1080p capture • 24 fps, two-frame holds • sparks disappear before the final pose hold</div>
<script src="vendor/three.min.js"></script><script src="antigravity_king.js"></script><script src="motion_rig.js"></script><script src="hero_effects.js"></script><script>
THREE.ColorManagement.legacyMode=false;
var scene=new THREE.Scene(), robot=AntigravityKing.build(), rig=MechaMotionRig.build(robot);scene.add(robot.root);
var renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setSize(1280,720);renderer.setClearColor(0,0);renderer.outputEncoding=THREE.sRGBEncoding;document.getElementById('stage').appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,.35));var key=new THREE.DirectionalLight(0xffffff,.95);key.position.set(30,50,45);scene.add(key);var fill=new THREE.DirectionalLight(0xffffff,.25);fill.position.set(-30,20,-20);scene.add(fill);
var camera=new THREE.PerspectiveCamera(32,16/9,.1,500), effects=HeroEffects.build(scene,robot.palette),playing=false,clock=0,last=0;
var V=function(x,y,z){return new THREE.Vector3(x,y,z);};function ease(x){x=THREE.MathUtils.clamp(x,0,1);return x*x*(3-2*x);}
function render(shot,time,w,h){
 if(w){renderer.setSize(w,h);camera.aspect=w/h;}
 var t=Math.floor((time+1e-7)*12)/12, data=rig[shot](t);camera.up.set(0,1,0);
 if(shot==='cross'){
   var follow=ease((t-1.02)/.72), pull=ease((t-1.55)/.55);
   var wristY=(data.arms[0].wrist[1]+data.arms[1].wrist[1])/2;
   var look=V(0,27,7).lerp(V(0,wristY+1,6),follow).lerp(V(0,16.5,1.5),pull);
   camera.position.copy(V(6,35,38).lerp(V(7,wristY+8,43),follow).lerp(V(15,7.5,68),pull));
   camera.fov=38-6*pull;camera.lookAt(look);camera.rotateZ(THREE.MathUtils.degToRad(-15+8*pull));
 }else{
   camera.fov=34;camera.position.set(25,9,62);camera.lookAt(0,16,1.5);camera.rotateZ(THREE.MathUtils.degToRad(-18));
 }
 camera.updateProjectionMatrix();camera.updateMatrixWorld();
 var fx=effects.render(shot==='cross'?t:100,robot,camera);renderer.render(scene,camera);
 return Object.assign(data,{effects:fx,camera:{position:camera.position.toArray(),fov:camera.fov},time:t});
}
document.getElementById('play').onclick=function(){playing=!playing;};document.getElementById('time').oninput=function(e){playing=false;clock=+e.target.value;draw();};document.getElementById('shot').onchange=function(){clock=0;draw();};
function draw(){render(document.getElementById('shot').value,clock);document.getElementById('time').value=clock;document.getElementById('stamp').value=clock.toFixed(2)+' s';}
function frame(t){if(playing){clock=(clock+(t-last)/1000)%4.5;draw();}last=t;requestAnimationFrame(frame);}draw();requestAnimationFrame(frame);
window.MotionLab={robot:robot,rig:rig,scene:scene,camera:camera,renderer:renderer,render:render,stop:function(){playing=false;}};
</script></html>
